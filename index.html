<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>VisLab Interactive Banner</title>
  <style>
    :root {
      --mx: 55%;
      --my: 42%;
      --title-x: 0px;
      --title-y: 0px;
      --title-glow: .34;
      --title-glow-size: 28px;
      --title-spacing: 0px;
      --title-shadow-x: 0px;
      --title-shadow-y: 0px;
      --lens-x: 50vw;
      --lens-y: 50vh;
      --lens-opacity: 0;
      --lens-scale: .86;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07020c;
    }

    body {
      font-family: Roboto, "Helvetica Neue", Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 260px;
      overflow: hidden;
      isolation: isolate;
      background: #10051d;
    }

    .photo-layer {
      position: absolute;
      inset: -4%;
      z-index: 0;
      background-image:
        linear-gradient(110deg, rgba(25, 7, 50, .48), rgba(30, 30, 120, .14), rgba(105, 48, 190, .36)),
        url("vislab-hero-banner.jpg");
      background-size: cover;
      background-position: center;
      filter: saturate(1.12) contrast(1.06);
      transform: scale(1.025);
    }

    .photo-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(156, 190, 255, .22), transparent 25%),
        radial-gradient(circle at 22% 54%, rgba(164, 80, 255, .34), transparent 31%),
        radial-gradient(circle at 76% 38%, rgba(68, 102, 255, .28), transparent 32%),
        linear-gradient(to bottom, rgba(255, 255, 255, .02), rgba(8, 0, 18, .22) 72%, rgba(8, 0, 18, .46));
      mix-blend-mode: screen;
      opacity: .9;
      pointer-events: none;
    }

    #field {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: .13;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(circle at 50% 46%, black 0%, transparent 70%);
    }

    .edge-shade {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(to right, rgba(4, 0, 9, .18), transparent 24%, transparent 76%, rgba(4, 0, 9, .18)),
        linear-gradient(to bottom, rgba(0, 0, 0, .1), transparent 32%, rgba(0, 0, 0, .22));
    }

    .cursor-lens {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 4;
      width: 178px;
      height: 178px;
      border-radius: 999px;
      pointer-events: none;
      opacity: var(--lens-opacity);
      transform:
        translate3d(calc(var(--lens-x) - 89px), calc(var(--lens-y) - 89px), 0)
        scale(var(--lens-scale));
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .08), rgba(176, 218, 255, .035) 42%, rgba(111, 72, 190, .025) 64%, transparent 72%);
      border: 1px solid rgba(232, 242, 255, .2);
      box-shadow:
        inset 0 0 38px rgba(210, 230, 255, .12),
        0 0 42px rgba(160, 110, 255, .18);
      -webkit-backdrop-filter: blur(5px) saturate(1.18) brightness(1.04);
      backdrop-filter: blur(5px) saturate(1.18) brightness(1.04);
      will-change: transform, opacity;
    }

    .brand-title {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 5;
      margin: 0;
      color: rgba(255, 255, 255, .94);
      font-size: clamp(44px, 5.8vw, 86px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: var(--title-spacing);
      text-align: center;
      text-rendering: geometricPrecision;
      text-shadow:
        0 1px 1px rgba(0, 0, 0, .32),
        0 14px 42px rgba(0, 0, 0, .28),
        0 0 var(--title-glow-size) rgba(204, 226, 255, var(--title-glow));
      transform:
        translate3d(-50%, -50%, 0)
        translate3d(var(--title-x), var(--title-y), 0);
      user-select: none;
      pointer-events: none;
      will-change: transform, letter-spacing, text-shadow;
    }

    .brand-title::before {
      content: attr(data-title);
      position: absolute;
      inset: 0;
      z-index: -1;
      color: rgba(165, 105, 255, .24);
      filter: blur(16px);
      transform: translate3d(var(--title-shadow-x), var(--title-shadow-y), 0);
    }

    .brand-title span {
      display: inline-block;
      animation: letter-drift 6.8s ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes letter-drift {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }
      50% {
        transform: translate3d(0, -3px, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-layer {
        transform: scale(1.025);
      }

      .brand-title span {
        animation: none;
      }

      .cursor-lens {
        display: none;
      }
    }

    @media (max-width: 720px) {
      .brand-title {
        font-size: clamp(38px, 13vw, 62px);
      }
    }
  </style>
</head>
<body>
  <main class="hero" id="hero" aria-label="VisLab interactive digital twin background">
    <div class="photo-layer" id="photo"></div>
    <canvas id="field"></canvas>
    <div class="grain"></div>
    <div class="edge-shade"></div>
    <div class="cursor-lens" aria-hidden="true"></div>
    <h1 class="brand-title" data-title="VisLab" aria-label="VisLab">
      <span style="--delay: 0ms">V</span><span style="--delay: -720ms">i</span><span style="--delay: -1440ms">s</span><span style="--delay: -2160ms">L</span><span style="--delay: -2880ms">a</span><span style="--delay: -3600ms">b</span>
    </h1>
  </main>

  <script>
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d", { alpha: true });
    const root = document.documentElement;

    const pointer = { x: 0.58, y: 0.42, tx: 0.58, ty: 0.42 };
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let width = 0;
    let height = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function smoothstep(edge0, edge1, value) {
      const x = clamp((value - edge0) / (edge1 - edge0), 0, 1);
      return x * x * (3 - 2 * x);
    }

    function wallMask(nx, ny) {
      const top = 0.19 + Math.pow(Math.abs(nx - 0.5) * 1.7, 2) * 0.08;
      const bottom = 0.83 - Math.pow(Math.abs(nx - 0.5) * 1.6, 2) * 0.04;
      const side = smoothstep(0.04, 0.13, nx) * (1 - smoothstep(0.89, 0.98, nx));
      const vertical = smoothstep(top, top + 0.09, ny) * (1 - smoothstep(bottom - 0.08, bottom, ny));
      return clamp(side * vertical, 0, 1);
    }

    function updatePointerStyles() {
      const dx = pointer.tx - 0.5;
      const dy = pointer.ty - 0.5;
      const centerPull = Math.max(0, 1 - Math.hypot(dx, dy) * 1.7);
      const mask = wallMask(pointer.tx, pointer.ty);

      root.style.setProperty("--mx", (pointer.tx * 100).toFixed(2) + "%");
      root.style.setProperty("--my", (pointer.ty * 100).toFixed(2) + "%");
      root.style.setProperty("--lens-x", (pointer.tx * width).toFixed(2) + "px");
      root.style.setProperty("--lens-y", (pointer.ty * height).toFixed(2) + "px");
      root.style.setProperty("--lens-opacity", (mask * 0.74).toFixed(3));
      root.style.setProperty("--lens-scale", (0.82 + mask * 0.2).toFixed(3));
      root.style.setProperty("--title-x", (dx * 12).toFixed(2) + "px");
      root.style.setProperty("--title-y", (dy * 8).toFixed(2) + "px");
      root.style.setProperty("--title-glow", (0.28 + centerPull * 0.32).toFixed(3));
      root.style.setProperty("--title-glow-size", (18 + centerPull * 28).toFixed(2) + "px");
      root.style.setProperty("--title-spacing", (Math.max(0, 1 - Math.hypot(dx, dy) * 2) * 0.8).toFixed(2) + "px");
      root.style.setProperty("--title-shadow-x", (dx * -5.6).toFixed(2) + "px");
      root.style.setProperty("--title-shadow-y", (dy * -3.6).toFixed(2) + "px");
    }

    window.addEventListener("pointermove", (event) => {
      pointer.tx = event.clientX / Math.max(1, width);
      pointer.ty = event.clientY / Math.max(1, height);
      updatePointerStyles();
    }, { passive: true });

    const glyphs = [">", "›", "o", "·", "-", "•"];
    const glyphField = [];
    for (let row = 0; row < 30; row++) {
      for (let col = 0; col < 86; col++) {
        const x = 0.035 + col * 0.0111;
        const y = 0.13 + row * 0.0252;
        const mask = wallMask(x, y);
        if (mask > 0.08 && Math.random() > 0.08) {
          glyphField.push({
            x,
            y,
            mask,
            phase: Math.random() * Math.PI * 2,
            speed: 0.45 + Math.random() * 0.8,
            glyph: glyphs[(col + row * 3) % glyphs.length]
          });
        }
      }
    }

    const ripples = [];

    window.addEventListener("pointerdown", (event) => {
      const x = event.clientX / Math.max(1, width);
      const y = event.clientY / Math.max(1, height);
      const mask = wallMask(x, y);
      if (mask > 0.08) {
        ripples.push({
          x,
          y,
          start: performance.now(),
          strength: mask
        });
        if (ripples.length > 5) {
          ripples.shift();
        }
      }
    }, { passive: true });

    function drawBlob(x, y, r, colorA, colorB) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, colorA);
      g.addColorStop(1, colorB);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function frame(ms) {
      const t = ms * 0.001;

      pointer.x += (pointer.tx - pointer.x) * 0.045;
      pointer.y += (pointer.ty - pointer.y) * 0.045;

      ctx.clearRect(0, 0, width, height);

      ctx.globalCompositeOperation = "screen";
      drawBlob(width * 0.24, height * (0.58 + Math.sin(t * 0.34) * 0.02), Math.max(width, height) * 0.3,
        "rgba(156, 90, 255, .12)", "rgba(156, 90, 255, 0)");
      drawBlob(width * 0.72, height * (0.42 + Math.cos(t * 0.29) * 0.02), Math.max(width, height) * 0.25,
        "rgba(78, 132, 255, .10)", "rgba(78, 132, 255, 0)");
      drawBlob(width * pointer.x, height * pointer.y, Math.max(width, height) * 0.13,
        "rgba(215, 232, 255, .12)", "rgba(215, 232, 255, 0)");

      ctx.globalCompositeOperation = "source-over";

      ctx.font = "12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const activeRipples = [];
      for (const ripple of ripples) {
        const age = (ms - ripple.start) / 900;
        if (age < 1) {
          activeRipples.push(ripple);
        }
      }
      ripples.length = 0;
      ripples.push(...activeRipples);

      for (const g of glyphField) {
        const drift = (t * 0.018 * g.speed + g.phase) % 1;
        const nx = 0.035 + ((g.x - 0.035 + drift) % 0.94);
        const ny = g.y + Math.sin(t * 0.5 + g.phase) * 0.004;
        const mask = wallMask(nx, ny);
        if (mask < 0.06) {
          continue;
        }

        const baseX = nx * width;
        const baseY = ny * height;
        const dx = baseX - pointer.x * width;
        const dy = baseY - pointer.y * height;
        const dist = Math.hypot(dx, dy);
        const influence = Math.max(0, 1 - dist / 210);
        let rippleBoost = 0;

        for (const ripple of ripples) {
          const age = (ms - ripple.start) / 900;
          const ring = age * 250;
          const rd = Math.hypot(baseX - ripple.x * width, baseY - ripple.y * height);
          rippleBoost += Math.max(0, 1 - Math.abs(rd - ring) / 34) * (1 - age) * ripple.strength;
        }

        const push = influence * 18 + rippleBoost * 16;
        const safeDist = Math.max(1, dist);
        const x = baseX + (dx / safeDist) * push;
        const y = baseY + (dy / safeDist) * push + Math.sin(t * 1.8 + g.phase) * influence * 3;
        const pulse = 0.5 + 0.5 * Math.sin(t * 1.4 + g.phase);
        const alpha = Math.min(0.82, 0.06 + mask * 0.18 + influence * 0.48 + rippleBoost * 0.42 + pulse * 0.04);

        ctx.fillStyle = `rgba(238,246,255,${alpha})`;
        ctx.fillText(g.glyph, x, y);
      }

      ctx.lineWidth = 1;
      for (let row = 0; row < 11; row++) {
        const ny = 0.28 + row * 0.042;
        const phase = t * 0.42 + row * 0.8;
        ctx.beginPath();
        for (let i = 0; i < 66; i++) {
          const nx = 0.08 + i * 0.013;
          const y = (ny + Math.sin(i * 0.22 + phase) * 0.006 + Math.sin(nx * Math.PI) * 0.025) * height;
          const x = nx * width;
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.strokeStyle = `rgba(212,235,255,${0.018 + row * 0.003})`;
        ctx.stroke();
      }

      for (const ripple of ripples) {
        const age = (ms - ripple.start) / 900;
        const radius = age * 250;
        const alpha = (1 - age) * ripple.strength;
        ctx.strokeStyle = `rgba(230,244,255,${alpha * 0.42})`;
        ctx.lineWidth = 1 + alpha * 2;
        ctx.beginPath();
        ctx.arc(ripple.x * width, ripple.y * height, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = `rgba(176,130,255,${alpha * 0.26})`;
        ctx.beginPath();
        ctx.arc(ripple.x * width, ripple.y * height, radius * 0.62, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (!prefersReducedMotion) {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
