<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>VisLab Interactive Banner</title>
  <style>
    :root {
      --mx: 55%;
      --my: 42%;
      --parallax-x: 0;
      --parallax-y: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07020c;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 260px;
      overflow: hidden;
      isolation: isolate;
      background: #10051d;
    }

    .photo-layer {
      position: absolute;
      inset: -4%;
      z-index: 0;
      background-image:
        linear-gradient(110deg, rgba(25, 7, 50, .48), rgba(30, 30, 120, .14), rgba(105, 48, 190, .36)),
        url("vislab-hero-banner.jpg");
      background-size: cover;
      background-position: center;
      filter: saturate(1.12) contrast(1.06);
      transform: translate3d(
          calc(var(--parallax-x) * -14px),
          calc(var(--parallax-y) * -9px),
          0
        )
        scale(1.035);
      will-change: transform;
    }

    .photo-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(156, 190, 255, .22), transparent 25%),
        radial-gradient(circle at 22% 54%, rgba(164, 80, 255, .34), transparent 31%),
        radial-gradient(circle at 76% 38%, rgba(68, 102, 255, .28), transparent 32%),
        linear-gradient(to bottom, rgba(255, 255, 255, .02), rgba(8, 0, 18, .22) 72%, rgba(8, 0, 18, .46));
      mix-blend-mode: screen;
      opacity: .9;
      pointer-events: none;
    }

    #field {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: .13;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(circle at 50% 46%, black 0%, transparent 70%);
    }

    .edge-shade {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(to right, rgba(4, 0, 9, .18), transparent 24%, transparent 76%, rgba(4, 0, 9, .18)),
        linear-gradient(to bottom, rgba(0, 0, 0, .1), transparent 32%, rgba(0, 0, 0, .22));
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-layer {
        transform: scale(1.025);
      }
    }
  </style>
</head>
<body>
  <main class="hero" id="hero" aria-label="VisLab interactive digital twin background">
    <div class="photo-layer" id="photo"></div>
    <canvas id="field"></canvas>
    <div class="grain"></div>
    <div class="edge-shade"></div>
  </main>

  <script>
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d", { alpha: true });
    const photo = document.getElementById("photo");
    const root = document.documentElement;

    const pointer = { x: 0.58, y: 0.42, tx: 0.58, ty: 0.42 };
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let width = 0;
    let height = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    window.addEventListener("pointermove", (event) => {
      pointer.tx = event.clientX / Math.max(1, width);
      pointer.ty = event.clientY / Math.max(1, height);
      root.style.setProperty("--mx", (pointer.tx * 100).toFixed(2) + "%");
      root.style.setProperty("--my", (pointer.ty * 100).toFixed(2) + "%");
      root.style.setProperty("--parallax-x", (pointer.tx - 0.5).toFixed(3));
      root.style.setProperty("--parallax-y", (pointer.ty - 0.5).toFixed(3));
    }, { passive: true });

    const glyphs = ["·", "›", "•", "○", "—"];
    const streams = Array.from({ length: 22 }, () => ({
      x: Math.random(),
      y: 0.14 + Math.random() * 0.7,
      speed: 0.02 + Math.random() * 0.03,
      amp: 18 + Math.random() * 54,
      length: 9 + Math.floor(Math.random() * 14),
      phase: Math.random() * Math.PI * 2,
      glyph: glyphs[Math.floor(Math.random() * glyphs.length)]
    }));

    const nodes = Array.from({ length: 220 }, () => ({
      x: 0.08 + Math.random() * 0.84,
      y: 0.12 + Math.random() * 0.7,
      r: Math.random() * 1.2 + 0.35,
      phase: Math.random() * Math.PI * 2,
      drift: Math.random() * 0.7 + 0.3
    }));

    function drawBlob(x, y, r, colorA, colorB) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, colorA);
      g.addColorStop(1, colorB);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function frame(ms) {
      const t = ms * 0.001;

      pointer.x += (pointer.tx - pointer.x) * 0.045;
      pointer.y += (pointer.ty - pointer.y) * 0.045;

      ctx.clearRect(0, 0, width, height);

      ctx.globalCompositeOperation = "screen";
      drawBlob(width * (0.18 + pointer.x * 0.07), height * (0.54 + Math.sin(t * 0.38) * 0.025), Math.max(width, height) * 0.42,
        "rgba(156, 90, 255, .22)", "rgba(156, 90, 255, 0)");
      drawBlob(width * (0.78 - pointer.x * 0.05), height * (0.34 + pointer.y * 0.05), Math.max(width, height) * 0.35,
        "rgba(78, 132, 255, .18)", "rgba(78, 132, 255, 0)");
      drawBlob(width * pointer.x, height * pointer.y, Math.max(width, height) * 0.18,
        "rgba(215, 232, 255, .14)", "rgba(215, 232, 255, 0)");

      ctx.globalCompositeOperation = "source-over";
      for (const n of nodes) {
        const dx = (pointer.x - 0.5) * 20 * n.drift;
        const dy = (pointer.y - 0.5) * 12 * n.drift;
        const pulse = 0.32 + 0.68 * Math.max(0, Math.sin(t * 0.9 + n.phase));
        const x = n.x * width + Math.sin(t * 0.24 + n.phase) * 6 + dx;
        const y = n.y * height + Math.cos(t * 0.22 + n.phase) * 4 + dy;

        ctx.fillStyle = `rgba(220,235,255,${0.10 + pulse * 0.24})`;
        ctx.beginPath();
        ctx.arc(x, y, n.r * pulse, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.font = "12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const s of streams) {
        s.x = (s.x + s.speed * 0.003) % 1.18;
        for (let i = 0; i < s.length; i++) {
          const p = i / Math.max(1, s.length - 1);
          const x = ((s.x + p * 0.036 + t * s.speed) % 1.18 - 0.09) * width;
          const y = s.y * height + Math.sin(t * 0.8 + p * 5.5 + s.phase) * s.amp;
          const dist = Math.hypot(x - pointer.x * width, y - pointer.y * height);
          const influence = Math.max(0, 1 - dist / 260);
          const alpha = 0.10 + 0.30 * (1 - p) + influence * 0.35;

          ctx.fillStyle = `rgba(235,242,255,${alpha})`;
          ctx.fillText(s.glyph, x + influence * 18, y - influence * 10);
        }
      }

      const sweepY = ((t * 0.055) % 1.05) * height;
      const grad = ctx.createLinearGradient(0, sweepY - 38, 0, sweepY + 38);
      grad.addColorStop(0, "rgba(190,230,255,0)");
      grad.addColorStop(0.5, "rgba(190,230,255,.10)");
      grad.addColorStop(1, "rgba(190,230,255,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, sweepY - 38, width, 76);

      if (!prefersReducedMotion) {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
